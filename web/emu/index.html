<!doctype html>

<!-- Trawler, the virtual FM-1 (P0-05): the screen x2, the Start button, the computer keyboard.
     The device runs in worklet.js; before Start a silent copy boots here to show its screen.
     Screen and input handling after FoMni's and X0X's web/emu/index.html (Charles Vestal).
     The clickable panel arrives with P0-06. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trawler</title>
<style>
:root { --bg: #15171a; --fg: #e6e7e9; --dim: #8b9097; --line: #2c3036; --accent: #f2d64b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 1.15rem; letter-spacing: .08em; margin: 0 0 16px; }
.screen { position: relative; width: min(480px, 100%); aspect-ratio: 1; margin: 0 auto; border: 1px solid var(--line); background: #000; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 11, 13, .55); }
.start[hidden] { display: none; }
.start button { font: 600 1.1rem system-ui, sans-serif; padding: .7em 1.8em; border: 0; border-radius: 6px; background: var(--accent); color: #111; cursor: pointer; }
.start button:disabled { opacity: .6; cursor: progress; }
#status, #stats { color: var(--dim); font-size: .9rem; margin: 10px 0 0; text-align: center; }
#stats { font-variant-numeric: tabular-nums; min-height: 1.3em; }
.keys { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--dim); font-size: .9rem; }
.keys ul { padding-left: 1.2em; margin: 6px 0; }
kbd { font: .85em ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>TRAWLER</h1>
  <div class="screen">
    <canvas id="screen" width="240" height="240" aria-label="L'écran du FM-1"></canvas>
    <div class="start" id="start"><button id="go" type="button">Démarrer</button></div>
  </div>
  <p id="status">Éteint : le son démarre au clic sur Démarrer.</p>
  <p id="stats"></p>
  <section class="keys">
    Au clavier de l'ordinateur (par position, quelle que soit la disposition) :
    <ul>
      <li><kbd>Z</kbd>…<kbd>M</kbd> et <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>H</kbd> <kbd>J</kbd> : F3 à E4 ;
          <kbd>Q</kbd>…<kbd>O</kbd> et <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>7</kbd> <kbd>9</kbd> : F4 à G5.</li>
      <li><kbd>-</kbd> <kbd>=</kbd> : OCT− / OCT+ ; <kbd>Maj</kbd> : SEL.</li>
    </ul>
  </section>
</main>
<script src="keymap.js"></script>
<script>
"use strict";
const KM = globalThis.TRAWLER_KEYMAP;
const status = document.getElementById("status"), stats = document.getElementById("stats");

// ---------------------------------------------------------------- the screen
// fb[i] is RGB565 with its bytes swapped (as the panel takes it): one lookup per pixel to RGBA
const LUT = new Uint32Array(65536);
for (let v = 0; v < 65536; v++) {
  const p = ((v >> 8) | (v << 8)) & 0xFFFF;
  const r = ((p >> 11) * 527 + 23) >> 6, g = (((p >> 5) & 63) * 259 + 33) >> 6, b = ((p & 31) * 527 + 23) >> 6;
  LUT[v] = (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;   // ImageData bytes R G B A, little-endian
}
const ctx = document.getElementById("screen").getContext("2d");
const img = ctx.createImageData(240, 240), px = new Uint32Array(img.data.buffer);
function drawScreen(fb) {
  for (let i = 0; i < 240 * 240; i++) px[i] = LUT[fb[i]];
  ctx.putImageData(img, 0, 0);
}

// ---------------------------------------------------------------- the module
const stubs = () => { const s = new Proxy({}, { get: () => () => 0 }); return { wasi_snapshot_preview1: s, env: s }; };
const wasmBytes = fetch("trawler.wasm").then((r) => {
  if (!r.ok) throw new Error(`trawler.wasm : ${r.status}`);
  return r.arrayBuffer();
});

// before Start: a silent copy boots and draws its first screen (nothing plays before a click)
(async () => {
  try {
    const { instance } = await WebAssembly.instantiate(await wasmBytes, stubs());
    const ex = instance.exports;
    if (ex._initialize) ex._initialize();
    ex.web_boot();
    ex.web_run_ms(50);
    drawScreen(new Uint16Array(ex.memory.buffer, ex.web_fb(), 240 * 240));
  } catch (err) {
    status.textContent = "Impossible de charger le module : " + (err && err.message || err);
  }
})();

// ---------------------------------------------------------------- input
let node = null, btnMask = 0, keyMask = 0;
const held = new Map();                 // KeyboardEvent.code -> {key} or {btn}
function send(m) { if (node) node.port.postMessage(m); }
function sync() {
  let b = 0, k = 0;
  for (const h of held.values()) {
    if (h.key !== undefined) k |= 1 << h.key;
    else b |= 1 << h.btn;
  }
  if (!node) return;
  if (b !== btnMask) { btnMask = b; send({ type: "buttons", mask: b >>> 0 }); }
  if (k !== keyMask) { keyMask = k; send({ type: "keys", mask: k >>> 0 }); }
}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = KM.keys[e.code], btn = KM.buttons[e.code];
  if (key === undefined && btn === undefined) return;
  e.preventDefault();
  if (e.repeat) return;
  held.set(e.code, key !== undefined ? { key } : { btn });
  sync();
});
addEventListener("keyup", (e) => { if (held.delete(e.code)) sync(); });
function releaseAll() { held.clear(); sync(); }
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAll();
  send({ type: "visible", value: !document.hidden });
});

// ---------------------------------------------------------------- frames from the worklet
const state = { rate: 0, last: null, nz: 0, frames: 0, msgs: 0 };
window.trawler = state;                 // for inspection from the console
function onFrame(m) {
  state.last = m;
  state.msgs++;
  state.nz += m.nz;
  state.frames = m.frames;
  if (m.fb) drawScreen(m.fb);
  if (m.load !== undefined) state.load = m.load;
  stats.textContent = `${state.rate} Hz · appareil ${(m.now / 1000).toFixed(1)} s · ${m.frames} frames · ` +
    `${state.nz} échantillons non nuls · pic ${m.peak}` + (state.load !== undefined ? ` · ${state.load} % du temps réel` : "");
}

// ---------------------------------------------------------------- Start
async function start() {
  const go = document.getElementById("go");
  go.disabled = true;
  go.textContent = "Démarrage…";
  try {
    let ac;
    try { ac = new AudioContext({ sampleRate: 44100, latencyHint: "interactive" }); }
    catch { ac = new AudioContext({ latencyHint: "interactive" }); }   // the worklet resamples
    await ac.audioWorklet.addModule("worklet.js");
    const n = new AudioWorkletNode(ac, "trawler", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    n.connect(ac.destination);
    const ready = new Promise((res, rej) => {
      n.port.onmessage = (e) => {
        const m = e.data;
        if (m.type === "frame") onFrame(m);
        else if (m.type === "ready") { state.rate = m.rate; res(); }
        else if (m.type === "error") rej(new Error(m.message));
      };
    });
    const wasm = (await wasmBytes).slice(0);
    n.port.postMessage({ type: "load", wasm, store: {}, master: 2048 }, [wasm]);
    await ready;
    await ac.resume();
    node = n;
    document.getElementById("start").hidden = true;
    status.textContent = ac.sampleRate === 44100 ? "Allumé (44,1 kHz)."
      : `Allumé (le navigateur joue à ${ac.sampleRate} Hz : le worklet rééchantillonne).`;
    sync();
  } catch (err) {
    go.disabled = false;
    go.textContent = "Démarrer";
    status.textContent = "Démarrage impossible : " + (err && err.message || err);
  }
}
document.getElementById("go").addEventListener("click", start);
</script>
</body>
</html>
